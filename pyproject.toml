[project]
name = "xplane-runway-extractor"
version = "0.1.0"
description = "Extractor de datos de pistas de X-Plane"
requires-python = ">=3.10"
dependencies = [
    "xplane_airports>=4.0.0",
    "mysql-connector-python>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
